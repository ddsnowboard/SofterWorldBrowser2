<html>
<head>
    <title>Unofficial A Softer World Reader</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="https://code.jquery.com/jquery-2.2.3.min.js"></script>
    <script src="main.js"></script>
</head>
<body>
    <h2>A Softer World</h2>
    <div id="titleBox">
    </div>
    <div id="holder">
        <div id="number">
        </div>
        <div id="imageHolder">
            <img src="waiting.gif">
            <br />
            Please Wait...
        </div>
        <div class="button" id="left">
            &lt;&lt;&lt;&lt; (Z)
        </div>
        <div class="button" id="random">
            Random (S)
        </div>
        <div class="button" id="right">
            (C) &gt;&gt;&gt;&gt;
        </div>
        <div id="showTitle" class="button">
            Show Title (X)
        </div>
    </div>
</body>
</html>
